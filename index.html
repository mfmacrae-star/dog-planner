<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Dog Planner</title>
    <meta name="description" content="Digital Dog Planner is a day planner and calendar for dog owners to organize walks, meals, grooming, vet visits, and medications, and sync them with Google Calendar." />
    <meta name="theme-color" content="#d97706" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            // Check for a newer worker on load and hourly, so an open tab picks
            // up a deploy without the user knowing to hard-refresh.
            reg.update();
            setInterval(() => reg.update(), 60 * 60 * 1000);
          });
          // A new worker calls skipWaiting + clients.claim, which fires this.
          // Reload once so the tab runs the new bundle instead of the old one.
          let reloading = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloading) return;
            reloading = true;
            window.location.reload();
          });
        });
      }
    </script>
  </body>
</html>
